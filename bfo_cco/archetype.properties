iri = urn:stardog:archetype:bfo_cco#

# Load BFO/CCO into the database's default reasoning schema graph. On Stardog 12
# the inline schema otherwise lands in a named graph (the archetype IRI) that is
# NOT in reasoning.schema.graphs, so the ontology would be present but ignored
# by the reasoner.
schema.graph = tag:stardog:api:context:schema

# Keep the SHACL shapes out of the reasoning schema.
constraints.graph = urn:stardog:archetype:bfo_cco:constraints
